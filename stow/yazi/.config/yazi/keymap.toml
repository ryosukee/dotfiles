# yazi keymap overrides
# %h は yazi が自動でシェル安全にクォートしてくれるので、テンプレート側で
# さらに引用符を付けない。

[[mgr.prepend_keymap]]
on   = "M"
run  = 'shell "mpv --image-display-duration=inf --autofit=100%x100% %h" --orphan'
desc = "Open hovered media with mpv (GUI)"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin wide-preview"
desc = "Toggle a preview-heavy layout"
