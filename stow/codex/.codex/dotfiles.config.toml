model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
personality = "pragmatic"
service_tier = "default"
approvals_reviewer = "user"

# AGENTS.md がない場合は、CLAUDE.md を project instructions として読み込む。
project_doc_fallback_filenames = ["CLAUDE.md"]

# リポジトリルートと作業ディレクトリから読む project instructions の合計上限。
# 既定の 32 KiB では末尾が切れる可能性があるため 64 KiB とし、超えたら指示の構成を見直す。
project_doc_max_bytes = 65536

# dotfiles の marketplace にある必須 plugin を、plugin 自体とは独立して確認する。
[[hooks.SessionStart]]
matcher = "startup|resume|clear"

[[hooks.SessionStart.hooks]]
type = "command"
command = "/bin/sh ~/.codex/scripts/check-required-plugins.sh"
timeout = 5

[tui]
# conversation recap を表示しない。
auto_recap = false

# model と reasoning、permission mode、context 残量、5 時間枠と週次枠の usage limit、作業ディレクトリを表示する。
# Codex 0.154.0 の usage limit は残量だけを表示し、reset 時刻を表示する項目はない。
status_line = [
  "model-with-reasoning",
  "permissions",
  "context-remaining",
  "five-hour-limit",
  "weekly-limit",
  "current-dir",
]
